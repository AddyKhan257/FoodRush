# Package issue and CVEs scan 

name: Dependency scan

on:
  workflow_call:

jobs:
  dependencies-check:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      
      - name: OWASP dependencies check backend
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: foodrush-backend
          path: ./backend
          format: HTML
          out: reports/backend

      - name: OWASP dependencies check frontend
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: foodrush-frontend
          path: ./frontend
          format: HTML
          out: reports/frontend

      - name: upload dependency check reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: reports/

