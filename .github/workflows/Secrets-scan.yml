# secrets data credentials check 
# using GitLeaks
name: Secrets scan

on:
  workflow_call:

jobs:
  secrets-scans: 
    runs-on: ubuntu-latest
    steps:
      - name: code-checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}






 