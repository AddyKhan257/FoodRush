name: FoodRush CI

on:
  push: 
    branches: [main]

  pull_request:
    branches: [main]


jobs:
  backend-CI:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
        

    steps:
      - name: checkout source Code 
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESlint
        run: npm run lint
            
      - name: run test
        run: npm test


