name: FoodRush CI

on:
  push: 
    branches: [main]

  pull_request:
    branches: [main]


jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
        
    steps:
      - name: checkout source Code 
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run ESlint
        run: npm run lint
            
      - name: run test
        run: npm test -- --passWithNoTests


  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci

      - name: build frontend
        run: npm run build
        env:
          CI: false

      - name: run test
        run: npm test -- --passWithNoTests


  docker-build-push:
    needs: [backend-ci,frontend-ci]
    runs-on: ubuntu-latest
     
    steps:

      - name: code checkout
        uses: actions/checkout@v4
      
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=${{ vars.DOCKERHUB_USER }}/foodrush-app" >> $GITHUB_ENV
          
      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to dockerhub backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.IMAGE_NAME }}-backend:${{ github.sha }}

      - name: Build & Push to dockerhub frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

        
    

